name: Android APK

# Baut eine installierbare Test-APK ohne Expo-Konto direkt auf GitHub.
# Für den Play Store wird stattdessen per EAS ein signiertes AAB gebaut (siehe README).
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Das Android-SDK ist auf den GitHub-Runnern (ubuntu-latest) bereits vorinstalliert.

      - run: npm ci

      # Nativen Android-Ordner aus app.json erzeugen (Continuous Native Generation)
      - run: npx expo prebuild --platform android --no-install

      - name: APK bauen
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: pruefungskalender-bw-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
